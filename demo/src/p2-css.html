<style>
/* landing pages: KPI cards, board, to-dos */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card)}
.kpi-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 14.5px var(--f-h)}
.kpi-v{font:600 28px/1.1 var(--f-h)}
.kpi-v small{font:400 13px var(--f-b);color:var(--muted)}
.kpi-s{font-size:12.5px;color:var(--muted)}
.kpi-s.up{color:var(--pos)}
.kpi-s.down{color:var(--crit)}
.kpi .link{align-self:flex-start;font-size:13px}
.spark{display:block;width:100%;height:40px}
.sp-a{fill:var(--pri-ll)}
.sp-l{fill:none;stroke:var(--pri);stroke-width:2;vector-effect:non-scaling-stroke}
.bar{height:8px;border-radius:4px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--pri)}
.bar.warn i{background:var(--high-dot)}
.ov-g{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;overflow-x:auto}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--soft)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:2px 2px 4px;font-weight:700}
.bcol-h .c{margin-left:auto;font-size:12px;color:var(--muted)}
.bcol-e{padding:14px 6px;font-size:12.5px;color:var(--muted);text-align:center}
.tile{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card);text-align:left;font-size:13px}
.tile:hover{border-color:var(--pri)}
.tile.mine{border-color:var(--pri);box-shadow:inset 3px 0 0 var(--pri)}
.t-no{font-size:11.5px;color:var(--muted)}
.t-ti{font-weight:700;font-size:14px}
.t-ti .muted{font-weight:400;font-size:12.5px}
.t-flow{display:flex;align-items:center;gap:5px;min-width:0}
.t-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-pills{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.t-ago{margin-left:auto;font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tile.fresh{animation:arrive 1.1s ease-out}}
@keyframes arrive{from{background:var(--warn-bg)}to{background:var(--card)}}
.todos{display:flex;flex-direction:column;gap:10px}
.todo{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card)}
.todo .btn{align-self:flex-start}

/* list pages */
.lp{display:grid;grid-template-columns:230px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-l);background:var(--card);overflow:hidden}
.lp.prev{grid-template-columns:230px minmax(0,1fr) 310px}
.lmenu{display:flex;flex-direction:column;padding:10px 0 14px;border-right:1px solid var(--line);background:#FAFBFB}
.lmenu-h{padding:4px 14px 8px;font:600 15px var(--f-h)}
.lmenu .lg{display:flex;align-items:center;gap:6px;width:100%;padding:7px 12px;border:0;background:none;font-weight:700;text-align:left}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:6px 14px 6px 32px;border:0;background:none;color:var(--text-2);font-size:13.5px;text-align:left}
.li:hover{background:var(--soft)}
.li.on{background:var(--pri-ll);color:var(--pri-dd);font-weight:700;box-shadow:inset 3px 0 0 var(--pri)}
.li .c{font-size:12px;color:var(--muted)}
.lmain{display:flex;flex-direction:column;min-width:0}
.lsel{display:none;padding:12px 14px 0}
.lbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px 8px}
.lbar h2{font:600 17px var(--f-h)}
.lsearch{display:flex;gap:6px;flex:1 1 280px;max-width:380px}
.lsearch select{width:118px;flex:none}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:0 14px 10px;font-size:13px}
.crumbs button:not(.ib){padding:0;border:0;background:none;color:var(--link)}
.crumbs button:not(.ib):hover{text-decoration:underline}
.crumbs .sep{color:var(--muted)}
.builder{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin:0 14px 10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--soft)}
.builder .fld{width:160px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{height:36px;padding:0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line-2);background:#fff;text-align:left;font-weight:700;white-space:nowrap}
.tbl th.r{text-align:right}
.sort{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font-weight:700}
.sort .i{color:var(--muted)}
.tbl td{height:40px;padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tbody tr:hover td{background:#F1F8FA}
.tbl tr.sel td{background:var(--pri-ll)}
.tbl tr.mine td{background:#F5FAFB}
.tbl .r{text-align:right}
.tbl .cb{width:34px;padding-right:0}
.tbl .cb input{width:15px;height:15px;accent-color:var(--pri)}
.tbl .pv{width:30px;padding:0 0 0 4px}
.tbl .pv .ib{width:26px;height:26px;color:var(--muted)}
.tbl .act{width:1%;text-align:right}
.tbl .who{gap:7px}
.tbl .tags{display:flex;flex-wrap:wrap;gap:4px}
.lfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.lfoot select{width:auto;height:30px;font-size:13px}
.pager{display:flex;align-items:center;gap:4px;color:var(--text-2)}
.pager .ib{width:26px;height:26px}
.lprev{display:flex;flex-direction:column;gap:12px;min-width:0;padding:14px;border-left:1px solid var(--panel-line);background:var(--panel)}
.lprev-h{display:flex;align-items:center;justify-content:space-between;font:600 15px var(--f-h)}

/* record pages */
.rec{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--card)}
.rec-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--line)}
.rec-h h1{font:600 19px/1.3 var(--f-h);text-wrap:balance}
.rec-h .sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:2px}
.rec-h .btns{margin-left:auto}
.rec-al{padding:12px 20px 0}
.rec-g{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr) 340px;grid-template-areas:"left sum side" "left act side";grid-template-rows:auto 1fr;align-items:start}
.r-left{grid-area:left;align-self:stretch;display:flex;flex-direction:column;gap:16px;padding:16px;border-right:1px solid var(--line)}
.r-sum{grid-area:sum;display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px 20px 0}
.r-act{grid-area:act;min-width:0;padding:6px 20px 28px}
.r-side{grid-area:side;align-self:stretch;display:flex;min-width:0;border-left:1px solid var(--panel-line);background:var(--panel)}
.r-form{grid-column:1 / 3;grid-row:1 / 3;min-width:0;padding:18px 20px 28px}
.sp{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;padding:14px}
.sp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 16px var(--f-h)}
.ibar{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:42px;padding:12px 0;background:var(--iconbar)}
.ibar button{position:relative;display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:50%;background:none;color:#1D4D5D}
.ibar button:hover{background:rgba(255,255,255,.55)}
.ibar button.on{background:#fff;color:var(--pri)}
.ibar .nb{top:-4px;right:-5px}
.pc{display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px;border-radius:var(--r-l);background:var(--card);box-shadow:0 1px 2px rgba(3,43,58,.08)}
.pc h4{font:600 14px var(--f-h)}
.cc{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card)}
.cc-h{display:flex;align-items:center;justify-content:space-between;font:600 15px var(--f-h)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.kv dt{font-size:11.5px;color:var(--muted)}
.kv dd{font-weight:700}
.sec-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0;border:0;background:none;font:600 16px var(--f-h);text-align:left}
.flds{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.f2 .wide{grid-column:1 / -1}
.sum{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1.5px solid var(--sum-line);border-radius:var(--r-l);background:var(--sum-bg)}
.sum-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;font-size:12.5px;color:var(--text-2)}
.sum-h span{display:inline-flex;align-items:center;gap:6px}
.sum b{font-weight:700}
.sum ul{padding-left:18px;list-style:disc}
.act-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px}
.act-h h2{font:600 17px var(--f-h)}
.compose{display:flex;gap:8px;margin-bottom:6px}
.compose .in{flex:1;min-width:0}
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-weight:700}
.ev-m{font-size:12px;font-weight:400;color:var(--muted)}
.ev-c{margin-top:3px;overflow-wrap:anywhere}
.ev.note .ev-c{padding:8px 10px;border:1px solid var(--note-line);border-radius:var(--r-m);background:var(--note)}
.ev.mine .ev-c{color:var(--text)}
.ring{position:relative;display:grid;place-items:center;padding:4px 0}
.ring>svg{width:112px;height:112px;transform:rotate(-90deg)}
.rg-t .i{width:26px;height:26px}
.rg-t .i.ok{color:var(--pos-dot)}
.rg-b{fill:none;stroke:#E3E8EA;stroke-width:9}
.rg-f{fill:none;stroke:var(--pos-dot);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.rg-f.warn{stroke:var(--high-dot)}
.rg-f.bad{stroke:var(--crit-dot)}
.rg-f.gray{stroke:var(--low-line)}
.rg-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.rg-t b{font:600 16px var(--f-h)}
.rg-t span{max-width:84px;font-size:11px;color:var(--muted)}
.stps li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #E4ECEF;font-size:13.5px}
.stps li:last-child{border-bottom:0}
.stps .d{display:grid;place-items:center;flex:none;width:22px;height:22px;border:2px solid var(--line-2);border-radius:50%;background:#fff;font-size:11px;font-weight:700;color:var(--muted)}
.stps .done .d{border-color:var(--pos-dot);background:var(--pos-dot);color:#fff}
.stps .now{font-weight:700}
.stps .now .d{border-color:var(--pri);color:var(--pri)}
.stps .bad .d{border-color:var(--crit-dot);background:var(--crit-dot);color:#fff}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-l);background:var(--card);box-shadow:0 1px 2px rgba(3,43,58,.1)}
.file b{display:block;font-size:13.5px}
.starsel{display:flex;gap:2px}
.starsel button{padding:0 2px;border:0;background:none;color:var(--line-2)}
.starsel button.on{color:#E2A10B}
.give-get{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-l)}
.give-get div{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.give-get div + div{border-left:1px solid var(--line);background:var(--pos-bg)}
.give-get b{font:600 19px var(--f-h)}

/* wallet, admin, telegram */
.w-g,.ad-g{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.ad-g{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.memo{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--warn-line);border-radius:var(--r-m);background:var(--warn-bg)}
.memo b{font:600 21px var(--f-h);letter-spacing:.02em}
.addr{padding:10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--soft);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
.qr{display:block;width:132px;height:132px;padding:6px;border:1px solid var(--line);background:#fff}
.dc{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card)}
.dc + .dc{margin-top:10px}
.dc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.claims{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.claims div{padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--soft);font-size:13.5px}
.log li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log li:last-child{border-bottom:0}
.switch{display:inline-flex;align-items:center;gap:10px;padding:0;border:0;background:none;font-weight:700}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--pri);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:21px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch.off .sw{background:var(--crit-dot)}
.switch.off .sw::after{left:3px}
.tgfeed{display:flex;flex-direction:column;gap:8px;height:min(520px,60vh);overflow-y:auto;padding:14px;background:#EEF3F5}
.tm{align-self:flex-start;display:flex;flex-direction:column;gap:6px;max-width:min(520px,92%);padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card);overflow-wrap:anywhere}
.tm.me{align-self:flex-end;border-color:var(--pri-d);background:var(--pri-d);color:#fff}
.tm.post{align-self:stretch;max-width:none}
.tm.pin{align-self:stretch;max-width:none;border-color:var(--warn-line);background:var(--warn-bg)}
.tm.del{border-style:dashed;background:transparent;color:var(--muted);font-style:italic;font-size:13px}
.tm time{align-self:flex-end;font-size:11px;color:var(--muted)}
.tm.me time{color:#CDE6EE}
.tm .from{font-size:12px;font-weight:700;color:var(--link)}
.tm .btn,.tm .pill{align-self:flex-start}
.tg-f{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
</style>
