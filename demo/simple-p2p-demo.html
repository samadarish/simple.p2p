<title>simple.p2p workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: an enterprise "workspace" shell. Dark top bar (menus, where-am-I pill, search, alerts), a thin colour rail of pages on the
   left (a bottom bar on phones), a strip of tabs for every open deal, then the page: dashboards, list pages and record pages.
   Record pages use three columns: details left, summary and activity in the middle, a light-blue side panel on the right.
   Teal is for actions; status colours (yellow locked, purple paid, green done, red dispute) only ever mark state. One light look. */
:root{
  --hdr:#032B3A;--hdr-2:#0C3F51;--hdr-field:#163F4F;--hdr-line:#2A5868;--on-hdr:#FFFFFF;--hdr-muted:#9DBDC8;--hdr-text:#E3EEF2;
  --pri:#0081A2;--pri-d:#00566E;--pri-dd:#002C38;--pri-l:#BCDFE7;--pri-ll:#E8F4F7;
  --strip:#C5E0E8;--strip-h:#D8EBF0;
  --bg:#F1F3F4;--card:#FFFFFF;--soft:#F6F8F9;--line:#D9DFE2;--line-2:#BCC4C9;
  --text:#1D262A;--text-2:#3D4A50;--muted:#65727A;--link:#00739A;
  --panel:#E2EDF1;--panel-line:#CBDDE4;--iconbar:#C2DCE4;
  --pos:#2F6301;--pos-bg:#E0EFD3;--pos-dot:#3F8500;--pos-line:#9CC77E;
  --info:#005D9A;--info-bg:#DDECF9;--info-dot:#0079CC;--info-line:#8CBDE6;
  --mod:#4F3BA6;--mod-bg:#EBE6FD;--mod-dot:#7A5DF0;--mod-line:#B3A3F6;
  --warn:#5E5007;--warn-bg:#FFF6C4;--warn-dot:#C9AC10;--warn-line:#E8D466;
  --high:#7A4700;--high-bg:#FFE7C4;--high-dot:#FD9601;--high-line:#F5B860;
  --crit:#A81A29;--crit-bg:#FCDDE0;--crit-dot:#E52238;--crit-line:#EE8A94;
  --low:#4A5053;--low-bg:#E6E8E9;--low-dot:#6D7376;--low-line:#B4B8BA;
  --note:#FFF8DC;--note-line:#EDDC98;--sum-line:#71BC8F;--sum-bg:#F4FAF6;
  --f-h:"Cabin","Lato",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-b:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-s:2px;--r-m:6px;--r-l:8px;--top:calc(48px + env(safe-area-inset-top,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font:400 14px/1.45 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr)}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{flex:none;vertical-align:-3px}
.i.fill{fill:currentColor}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:22px 12px;color:var(--muted);text-align:center}

/* top bar */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;height:48px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--hdr);color:var(--on-hdr)}
.hdr-l{display:flex;align-items:center;gap:2px;min-width:0}
.logo{display:flex;align-items:center;gap:8px;margin-right:12px;padding:0;border:0;background:none;color:var(--on-hdr);font:600 17px/1 var(--f-h);white-space:nowrap}
.logo em{font-style:normal;color:#8FD3E2}
.logo-mark{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--pri);color:#fff}
.hm{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid transparent;border-radius:var(--r-m);background:none;color:var(--hdr-text);font-size:14px;white-space:nowrap}
.hm:hover{background:var(--hdr-2)}
.hm.on{border-color:#5E8796;background:var(--hdr-2);color:#fff}
.hm .i{display:none}
.hdr-r{display:flex;align-items:center;justify-content:flex-end;gap:2px;min-width:0}
.gsearch{position:relative;display:flex;align-items:center;width:min(250px,20vw);height:32px;margin-right:6px;color:var(--hdr-muted)}
.gsearch .i{position:absolute;left:9px;pointer-events:none}
.gsearch input{width:100%;height:100%;padding:0 10px 0 31px;border:1px solid transparent;border-radius:var(--r-m);background:var(--hdr-field);color:#fff;font-size:13.5px}
.gsearch input::placeholder{color:var(--hdr-muted)}
.gsearch input:focus{outline:none;border-color:#7FB7C7;background:#0E3747}
.hi{position:relative;display:grid;place-items:center;flex:none;width:34px;height:34px;border:0;border-radius:50%;background:none;color:#D9E8ED}
.hi:hover{background:var(--hdr-2)}
.hi.ph{display:none}
.nb{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit-dot);color:#fff;font:700 10.5px/16px var(--f-b);text-align:center}
.hme{display:grid;place-items:center;flex:none;width:30px;height:30px;margin-left:4px;border:2px solid #5E8796;border-radius:50%;background:#D5E6EC;color:var(--pri-d);font-weight:700;font-size:13px}

/* shell: pinned menu, rail, tabs, page */
.shell{display:flex;align-items:stretch;min-height:calc(100vh - 48px)}
.pinned{position:sticky;top:var(--top);align-self:flex-start;flex:none;width:250px;height:calc(100vh - var(--top));overflow-y:auto;background:var(--hdr);color:var(--hdr-text);border-right:1px solid var(--hdr-line)}
.pin-t{padding:14px 14px 0;font:600 15px var(--f-h);color:#fff}
.rail{position:sticky;top:var(--top);align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:52px;height:calc(100vh - var(--top));padding:10px 0 12px;background:linear-gradient(180deg,#0A3A4C 0%,#0F5466 40%,#1B7480 68%,#3B9A5A 100%)}
.rb{position:relative;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:none;color:#E3F1F4}
.rb:hover{background:rgba(255,255,255,.14)}
.rb.on{background:#fff;color:var(--pri-d);box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.rb .nb{top:-3px;right:-4px}
.rb-l{display:none}
.rail .grow{flex:1}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{flex:1;display:flex;align-items:center;gap:4px;min-width:0;height:48px;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;flex:none;height:32px;border-radius:var(--r-m);color:#C7DCE3}
.tab:hover{background:var(--hdr-2)}
.tab.on{background:var(--hdr-2);color:#fff;box-shadow:inset 0 -2px 0 #62D84E}
.tb{display:flex;align-items:center;gap:7px;max-width:220px;height:100%;padding:0 8px 0 10px;border:0;background:none;color:inherit;font-size:13px;white-space:nowrap}
.tab.on .tb{font-weight:700}
.tb .tl{overflow:hidden;text-overflow:ellipsis}
.tstar{display:grid;place-items:center;flex:none;width:22px;height:22px;border:0;border-radius:4px;background:none;color:#9DBDC8}
.tstar.on{color:#86D592}
.tstar:hover{background:#1E5468;color:#fff}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--crit-dot)}
.tx{display:grid;place-items:center;width:22px;height:22px;margin-right:5px;border:0;border-radius:4px;background:none;color:#9DBDC8}
.tx:hover{background:#1E5468;color:#fff}
.tadd{display:grid;place-items:center;flex:none;width:30px;height:30px;border:0;border-radius:6px;background:none;color:#D9E8ED}
.tadd:hover{background:var(--hdr-2)}
.main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0;padding:16px 20px 48px}
.main.flush{padding:0;gap:0;background:var(--card)}

/* type, cards, buttons, fields */
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.ph h1{font:600 21px/1.25 var(--f-h);text-wrap:balance}
.sub{font-size:13px;color:var(--muted)}
.card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-height:46px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card-t{font:600 15.5px/1.3 var(--f-h)}
.card-b{padding:14px;min-width:0}
.cnt{padding:0 7px;border-radius:9px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text-2)}
.ml{margin-left:auto}
.btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--pri);border-radius:var(--r-m);background:var(--card);color:var(--pri-d);font-weight:700;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--pri-ll)}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:hover{border-color:var(--pri-d);background:var(--pri-d)}
.btn.plain{border-color:var(--line-2);color:var(--text-2)}
.btn.plain:hover{background:var(--soft)}
.btn.bad{border-color:var(--crit-dot);color:var(--crit)}
.btn.bad:hover{background:var(--crit-bg)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.lg{height:38px;padding:0 18px;font-size:14.5px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .nb{position:static;margin-left:2px}
.ib{display:grid;place-items:center;flex:none;width:30px;height:30px;border:0;border-radius:var(--r-m);background:none;color:var(--text-2)}
.ib:hover{background:var(--soft)}
.ib.on{background:var(--pri-ll);color:var(--pri-d)}
.ib.dk{color:var(--hdr-text)}
.ib.dk:hover{background:var(--hdr-2)}
.link{padding:0;border:0;background:none;color:var(--link);font-weight:700;text-align:left}
.link:hover{text-decoration:underline}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:12.5px;color:var(--text-2)}
.req::before{content:"* ";color:var(--crit-dot)}
.in{width:100%;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-m);background:#fff;color:var(--text);font-size:14px}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
textarea.in{height:auto;min-height:84px;padding:8px 10px;resize:vertical}
select.in{padding-right:6px}
.ro{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:5px 4px 5px 10px;border:1px solid var(--line);border-radius:var(--r-m);background:#F3F5F6;font-size:14px;overflow-wrap:anywhere}
.ro .ib{width:24px;height:24px}
.ck{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-m);cursor:pointer;font-weight:700}
.ck input{width:17px;height:17px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.ck:has(input:checked){border-color:var(--pri);background:var(--pri-ll)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-m);cursor:pointer}
.chk:has(input:checked){border-color:var(--pri);background:var(--pri-ll)}
.chk input{accent-color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-m);overflow:hidden}
.seg button{height:28px;padding:0 12px;border:0;border-left:1px solid var(--line-2);background:#fff;color:var(--text-2);font-size:12.5px;font-weight:700}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pri);color:#fff}

/* pills, tags, alerts, avatars */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-s);background:var(--low-bg);color:var(--low);font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nd::before{display:none}
.p-open{background:var(--info-bg);color:var(--info)}
.p-lock{background:var(--warn-bg);color:var(--warn)}
.p-paid{background:var(--mod-bg);color:var(--mod)}
.p-done{background:var(--pos-bg);color:var(--pos)}
.p-bad{background:var(--crit-bg);color:var(--crit)}
.p-high{background:var(--high-bg);color:var(--high)}
.p-low{background:var(--low-bg);color:var(--low)}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff;font-size:12px;color:var(--text-2);white-space:nowrap}
.alert{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border:1px solid;border-radius:var(--r-m);font-size:13.5px;color:var(--text)}
.alert .i{margin-top:1px}
.alert b{font-weight:700}
.a-critical{border-color:var(--crit-line);background:var(--crit-bg)}
.a-critical .i{color:var(--crit-dot)}
.a-high{border-color:var(--high-line);background:var(--high-bg)}
.a-warning{border-color:var(--warn-line);background:var(--warn-bg)}
.a-moderate{border-color:var(--mod-line);background:var(--mod-bg)}
.a-low{border-color:var(--low-line);background:var(--low-bg)}
.a-info{border-color:var(--info-line);background:var(--info-bg)}
.a-info .i{color:var(--info-dot)}
.a-positive{border-color:var(--pos-line);background:var(--pos-bg)}
.a-positive .i{color:var(--pos-dot)}
.av{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:#D5E6EC;color:var(--pri-d);font-weight:700;font-size:12.5px}
.av.sm{width:22px;height:22px;font-size:10.5px}
.av.lg{width:56px;height:56px;font-size:22px}
.av.sq{border-radius:var(--r-m)}
.av.e-lock{background:var(--warn-bg);color:var(--warn)}
.av.e-ok{background:var(--pos-bg);color:var(--pos)}
.av.e-bad{background:var(--crit-bg);color:var(--crit)}
.av.e-info{background:var(--info-bg);color:var(--info)}
.av.e-adm{background:var(--hdr);color:#fff}
.idok{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:4px;border-radius:50%;background:var(--pri);color:#fff;vertical-align:-2px}
.stars{display:inline-flex;align-items:center;gap:3px;color:var(--text);font-weight:700;white-space:nowrap}
.stars .i{color:#E2A10B}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who-n{display:flex;flex-direction:column;min-width:0;line-height:1.35}
</style>

<style>
/* landing pages: KPI cards, board, to-dos */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card)}
.kpi-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 14.5px var(--f-h)}
.kpi-v{font:600 28px/1.1 var(--f-h)}
.kpi-v small{font:400 13px var(--f-b);color:var(--muted)}
.kpi-s{font-size:12.5px;color:var(--muted)}
.kpi-s.up{color:var(--pos)}
.kpi-s.down{color:var(--crit)}
.kpi .link{align-self:flex-start;font-size:13px}
.spark{display:block;width:100%;height:40px}
.sp-a{fill:var(--pri-ll)}
.sp-l{fill:none;stroke:var(--pri);stroke-width:2;vector-effect:non-scaling-stroke}
.bar{height:8px;border-radius:4px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--pri)}
.bar.warn i{background:var(--high-dot)}
.ov-g{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;overflow-x:auto}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--soft)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:2px 2px 4px;font-weight:700}
.bcol-h .c{margin-left:auto;font-size:12px;color:var(--muted)}
.bcol-e{padding:14px 6px;font-size:12.5px;color:var(--muted);text-align:center}
.tile{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card);text-align:left;font-size:13px}
.tile:hover{border-color:var(--pri)}
.tile.mine{border-color:var(--pri);box-shadow:inset 3px 0 0 var(--pri)}
.t-no{font-size:11.5px;color:var(--muted)}
.t-ti{font-weight:700;font-size:14px}
.t-ti .muted{font-weight:400;font-size:12.5px}
.t-flow{display:flex;align-items:center;gap:5px;min-width:0}
.t-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-pills{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.t-ago{margin-left:auto;font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tile.fresh{animation:arrive 1.1s ease-out}}
@keyframes arrive{from{background:var(--warn-bg)}to{background:var(--card)}}
.todos{display:flex;flex-direction:column;gap:10px}
.todo{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--card)}
.todo .btn{align-self:flex-start}

/* list pages */
.lp{display:grid;grid-template-columns:230px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-l);background:var(--card);overflow:hidden}
.lp.prev{grid-template-columns:230px minmax(0,1fr) 310px}
.lmenu{display:flex;flex-direction:column;padding:10px 0 14px;border-right:1px solid var(--line);background:#FAFBFB}
.lmenu-h{padding:4px 14px 8px;font:600 15px var(--f-h)}
.lmenu .lg{display:flex;align-items:center;gap:6px;width:100%;padding:7px 12px;border:0;background:none;font-weight:700;text-align:left}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:6px 14px 6px 32px;border:0;background:none;color:var(--text-2);font-size:13.5px;text-align:left}
.li:hover{background:var(--soft)}
.li.on{background:var(--pri-ll);color:var(--pri-dd);font-weight:700;box-shadow:inset 3px 0 0 var(--pri)}
.li .c{font-size:12px;color:var(--muted)}
.lmain{display:flex;flex-direction:column;min-width:0}
.lsel{display:none;padding:12px 14px 0}
.lbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 14px 8px}
.lbar h2{font:600 17px var(--f-h)}
.lsearch{display:flex;gap:6px;flex:1 1 280px;max-width:380px}
.lsearch select{width:118px;flex:none}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:0 14px 10px;font-size:13px}
.crumbs button:not(.ib){padding:0;border:0;background:none;color:var(--link)}
.crumbs button:not(.ib):hover{text-decoration:underline}
.crumbs .sep{color:var(--muted)}
.builder{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin:0 14px 10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--soft)}
.builder .fld{width:160px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{height:36px;padding:0 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line-2);background:#fff;text-align:left;font-weight:700;white-space:nowrap}
.tbl th.r{text-align:right}
.sort{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font-weight:700}
.sort .i{color:var(--muted)}
.tbl td{height:40px;padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tbody tr:hover td{background:#F1F8FA}
.tbl tr.sel td{background:var(--pri-ll)}
.tbl tr.mine td{background:#F5FAFB}
.tbl .r{text-align:right}
.tbl .cb{width:34px;padding-right:0}

function keepFocus(fn){
  const a=document.activeElement;const id=a&&a.id;const da=a&&a.dataset&&a.dataset.a,dx=a&&a.dataset&&a.dataset.x;
  let s=null,e=null;try{s=a.selectionStart;e=a.selectionEnd}catch(x){}
  fn();
  if(!a||a===document.body||document.contains(a))return;
  let n=id?document.getElementById(id):null;
  if(!n&&da)n=document.querySelector(`[data-a="${da}"]${dx!=null?`[data-x="${CSS.escape(dx)}"]`:''}`);
  if(n){n.focus({preventScroll:true});try{if(s!=null&&n.setSelectionRange)n.setSelectionRange(s,e)}catch(x){}}
}

    S.risk.unshift({id:'RA-'+(80+S.risk.length),user:from,rule:'Tried to move an order chat off the app ('+d.id+')',sev:'high',st:'open',t:now()});

function drawQR(cv){const n=29,s=5,x=cv.getContext('2d');cv.width=n*s;cv.height=n*s;x.fillStyle='#fff';x.fillRect(0,0,n*s,n*s);x.fillStyle='#111';let h=1234567;const r=()=>{h=(h*1103515245+12345)&0x7fffffff;return h};
  for(let y=0;y<n;y++)for(let q=0;q<n;q++)if(r()%2)x.fillRect(q*s,y*s,s,s);
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillStyle='#fff';x.fillRect((a-1)*s,(b-1)*s,9*s,9*s);x.fillStyle='#111';x.fillRect(a*s,b*s,7*s,7*s);x.fillStyle='#fff';x.fillRect((a+1)*s,(b+1)*s,5*s,5*s);x.fillStyle='#111';x.fillRect((a+2)*s,(b+2)*s,3*s,3*s)})}

function vaHandle(k,label){const v=S.va;if(label)v.msgs.push({from:'you',text:label});
  if(k==='start')return vaBot('Hi! I am the simple.p2p assistant. What do you need help with?',VA_START);
  if(k==='order'){const a=activeMine();return a.length?vaBot(`You have ${a.length} order${a.length>1?'s':''} in progress. Which one?`,a.map(d=>['o:'+d.id,`${d.id} · ${u(d.usdt)} USDT · ${ST[d.st][0]}`])):vaBot('You have no orders in progress right now. Finished orders are in My orders.',[['go:ord:all','Open My orders'],['start','Something else']])}
  if(k.startsWith('o:')){const d=deal(k.slice(2));const tip=d.st==='locked'?(d.side==='buy'?`Pay ${m2(d.total)} ${d.fiat} to ${d.holder}, then tap "I have paid". You have ${dur(d.payBy-now())} left.`:`${d.cp} has ${dur(d.payBy-now())} left to pay you. Do not release anything yet.`):d.st==='paid'?(d.side==='buy'?`${d.cp} is checking their bank. If they do not release, you can appeal after the waiting time.`:'Check your own bank app. If the money is there, release the USDT.'):'The admin is checking this appeal. Add any proof in the order chat.';
    return vaBot(`Order ${d.id} is ${ST[d.st][0].toLowerCase()}. ${tip}`,[['go:deal:'+d.id,'Open order'],['human','Talk to a person']])}
  if(k==='sell')return vaBot('To sell: 1) pick a buyer ad in P2P trading, or post your own ad. 2) Wait for the buyer to pay. 3) Check YOUR bank app. 4) Release the USDT.',[['go:kb:KB0010005','Read the full article'],['go:list:sell-all','See buyer ads'],['start','Something else']]);
  if(k==='wd'){const w=S.txs.filter(x=>x.type==='Withdrawal').sort((a,b)=>b.t-a.t)[0];return vaBot(w?`Your last withdrawal (${u(-w.amt)} USDT, ${ago(w.t)}) is: ${w.st}. ${w.st==='Waiting for admin'?'Big withdrawals are checked by the admin first, usually within an hour.':''}`:'You have not made a withdrawal yet.',[['go:pg:wallet/history','Open wallet history'],['start','Something else']])}
  if(k==='fees')return vaBot('Taking an ad is free during the beta. Withdrawals cost 1 USDT for the TON network. Sending to another user is free.',[['go:pg:help/fees','Fees and limits'],['start','Something else']]);
  if(k==='human'){const c=newCase('Chat with the assistant','Other','','I asked the assistant to talk to a person.');return vaBot(`I opened request ${c.id} for you. A person replies within 1 hour, here and in Telegram.`,[['go:case:'+c.id,'Open request']])}
  if(k.startsWith('go:')){const key=k.slice(3);go(key);return}
  const res=kbSearch(k);return vaBot(res.length?'These articles may help:':'I am not sure about that. Try one of these:',res.length?res.slice(0,3).map(a=>['go:kb:'+a.id,a.title]).concat([['human','Talk to a person']]):VA_START)}

/* ---------- charts: one series each, teal marks, hover tooltip, data table ---------- */
function niceTicks(lo,hi,n){const step=(hi-lo)/(n-1);return Array.from({length:n},(_,k)=>lo+step*k)}
function xLabels(labels,n){const L=labels.length,k=Math.min(n,L),out=[];for(let j=0;j<k;j++){const i=Math.round(j*(L-1)/(k-1||1));out.push(i)}return [...new Set(out)]}
function dataTable(labels,vals,fmt,head){return `<details class="small" style="margin-top:4px"><summary class="muted" style="cursor:pointer">Show data</summary><table class="book" style="margin-top:6px"><thead><tr><th>${esc(head[0])}</th><th>${esc(head[1])}</th></tr></thead><tbody>${labels.map((l,i)=>`<tr><td>${esc(l)}</td><td>${fmt(vals[i])}</td></tr>`).join('')}</tbody></table></details>`}
function chartLine(id,vals,labels,fmt,aria){const mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn)*0.18||0.01,lo=mn-pad,hi=mx+pad,n=vals.length;
  const X=i=>i/(n-1)*1000,Y=v=>200-(v-lo)/(hi-lo)*200,d=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' '),ticks=niceTicks(lo,hi,4);
  CHARTS[id]={type:'line',vals,labels,fmt,yf:v=>(v-lo)/(hi-lo)};
  return `<div class="cbox" data-chart="${id}" role="img" aria-label="${esc(aria)}">${ticks.map(t=>`<span class="cy" style="bottom:${(t-lo)/(hi-lo)*100}%">${fmt(t)}</span>`).join('')}
    <svg class="csvg" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ga-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0081A2" stop-opacity=".2"/><stop offset="1" stop-color="#0081A2" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="gl" x1="0" x2="1000" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" vector-effect="non-scaling-stroke"/>`).join('')}<path d="${d} L1000 200 L0 200Z" fill="url(#ga-${id})"/><path class="ln" d="${d}" vector-effect="non-scaling-stroke"/><line class="xh" id="xh-${id}" x1="0" x2="0" y1="0" y2="200" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>
    <span class="cdot" id="cd-${id}" hidden></span>${xLabels(labels,5).map(i=>`<span class="cx" style="left:${i/(n-1)*100}%;${i===0?'transform:none':i===n-1?'transform:translateX(-100%)':''}">${esc(labels[i])}</span>`).join('')}<div class="tip" id="tip-${id}" hidden></div></div>`}
function chartBars(id,vals,labels,fmt,aria){const mx=Math.max(...vals)*1.12,n=vals.length,ticks=niceTicks(0,mx,4);
  CHARTS[id]={type:'bar',vals,labels,fmt,yf:v=>v/mx};
  return `<div class="cbox bars" data-chart="${id}" role="img" aria-label="${esc(aria)}">${ticks.map(t=>`<span class="cy" style="bottom:${t/mx*100}%">${fmt(t)}</span><span class="cg" style="bottom:${t/mx*100}%"></span>`).join('')}
    <div class="vbars">${vals.map((v,i)=>`<i style="height:${v/mx*100}%" data-i="${i}"></i>`).join('')}</div>${xLabels(labels,7).map(i=>`<span class="cx" style="left:${(i+.5)/n*100}%">${esc(labels[i])}</span>`).join('')}<div class="tip" id="tip-${id}" hidden></div></div>`}
let tipOn=null;
function chartHover(e){const b=e.target.closest&&e.target.closest('[data-chart]');
  if(!b){if(tipOn)hideTip();return}const id=b.dataset.chart,c=CHARTS[id];if(!c)return;if(tipOn&&tipOn!==id)hideTip();tipOn=id;
  const r=b.getBoundingClientRect(),n=c.vals.length;let i=c.type==='line'?Math.round((e.clientX-r.left)/r.width*(n-1)):Math.floor((e.clientX-r.left)/r.width*n);i=Math.max(0,Math.min(n-1,i));
  const xf=c.type==='line'?i/(n-1):(i+.5)/n,yf=c.yf(c.vals[i]),t=$('#tip-'+id);
  t.innerHTML=`<b>${c.fmt(c.vals[i])}</b>${esc(c.labels[i])}`;t.hidden=false;t.style.left=Math.max(56,Math.min(r.width-56,xf*r.width))+'px';t.style.top=(1-yf)*r.height+'px';
  if(c.type==='line'){const x=$('#xh-'+id),d=$('#cd-'+id);x.setAttribute('x1',xf*1000);x.setAttribute('x2',xf*1000);x.setAttribute('visibility','visible');d.hidden=false;d.style.left=xf*100+'%';d.style.top=(1-yf)*100+'%'}
  else b.querySelectorAll('.vbars i').forEach((el,k)=>el.classList.toggle('hov',k===i))}
function hideTip(){const id=tipOn;tipOn=null;const t=$('#tip-'+id);if(t)t.hidden=true;const x=$('#xh-'+id);if(x)x.setAttribute('visibility','hidden');const d=$('#cd-'+id);if(d)d.hidden=true;document.querySelectorAll(`[data-chart="${id}"] .vbars i.hov`).forEach(el=>el.classList.remove('hov'))}

/* ---------- clocks: timers each second, the market moves every 4 s ---------- */
function tickTimers(){
  document.querySelectorAll('[data-left]').forEach(el=>{el.textContent=dur(+el.dataset.left-now())});
  document.querySelectorAll('[data-since]').forEach(el=>{el.textContent=dur(now()-+el.dataset.since)});
  document.querySelectorAll('[data-unlock]').forEach(el=>{if(now()>=+el.dataset.unlock&&el.disabled)el.disabled=false});
  document.querySelectorAll('[data-appeal]').forEach(el=>{if(now()>=+el.dataset.appeal&&el.disabled){el.disabled=false;const s=el.querySelector('[data-left]');if(s)s.remove()}});
}
let tick=0;
setInterval(()=>{tickTimers();tickDeals();tick++;if(tick%4===0)moveBoard()},1000);
function moveBoard(){const k=tick/4,lock=S.board.filter(b=>b.st==='locked'),paid=S.board.filter(b=>b.st==='paid'),done=S.board.filter(b=>b.st==='done');
  if(k%3===0&&lock.length){const b=lock[0];b.st='paid';b.t=now();b.fresh=true}
  else if(k%3===1&&paid.length){const b=paid[0];b.st='done';b.t=now();b.fresh=true;S.doneToday++;if(k%2)S.channel.push({kind:'done',usdt:b.usdt,fiat:b.fiat,rating:trader(b.seller).rating,mins:3+(k%9),t:now()})}
  else{const others=S.offers.filter(o=>o.by!=='you'&&o.status==='online'&&!o.keep);if(others.length>9&&!S.paused){const o=others[others.length-1];o.status='closed';S.channel.forEach(p=>{if(p.kind==='new'&&p.o.id===o.id)p.taken=true});const cp=T[(T.indexOf(trader(o.by))+3)%T.length].id;S.board.push({id:'D-'+(DID++),buyer:o.side==='sell'?cp:o.by,seller:o.side==='sell'?o.by:cp,usdt:Math.min(o.avail,500),fiat:o.fiat,price:o.price,method:o.methods[0],st:'locked',t:now(),fresh:true})}}
  if(done.length>4)S.board=S.board.filter(b=>b!==done[0]);
  if(k%2===0&&S.offers.filter(o=>o.by!=='you'&&o.status==='online').length<14&&!S.paused){const t=T[k%T.length],side=k%4===0?'buy':'sell',amt=pick([100,200,300,500,750,1000,1500],k),pr=+(side==='sell'?3.66+(k%5)/100:3.60+(k%4)/100).toFixed(2);const o=mkAd(t.id,side,amt,pr,[pick(METHODS,k)],{min:50,max:Math.round(amt*pr)});o.t=now();S.offers.push(o);maCheck(o);if(k%4===2)S.channel.push({kind:'new',o,t:now(),taken:false})}
  const ph=S.priceHist;ph.push(+(ph[ph.length-1]+((k*13)%5-2)/500).toFixed(3));ph.shift();CUR.LC.market=ph[ph.length-1];
  S.offers.forEach(o=>{if(o.ptype==='float')o.price=adPrice(o)});checkAlerts();
  T.forEach((t,i)=>{if((k+i)%11===0)t.online=!t.online});
  const busy=S.modal||tipOn||(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&$('#main').contains(document.activeElement));
  if(S.active==='page'&&['home','market'].includes(S.page)&&!busy||(S.active==='page'&&S.page==='telegram'&&S.tg==='channel'&&!busy))render();else{renderRail();renderHeader()}
}
